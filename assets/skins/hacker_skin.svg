<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024" shape-rendering="crispEdges">
  <!-- ================================================================
       DARK HACKER MINECRAFT SKIN - 64x64 default skin layout
